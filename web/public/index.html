<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Todos los logros de un juego de Steam, ordenados por lo raros que son de verdad." />
    <title>Logros de Steam</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏆</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">🏆 Logros de Steam</h1>

      <form class="search" id="search-form" role="search" autocomplete="off">
        <label class="visually-hidden" for="search-input">Buscar un juego</label>
        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="Buscar un juego…"
          spellcheck="false"
          aria-describedby="search-hint"
        />
        <ul class="results" id="results" role="listbox" aria-label="Resultados" hidden></ul>
      </form>

      <details class="profile" id="profile">
        <summary>Mi perfil</summary>
        <div class="profile-body">
          <label for="steamid-input">
            SteamID64 (17 dígitos)
            <span class="hint">
              Se guarda solo en este navegador. Con él marcamos los logros que ya tienes.
            </span>
          </label>
          <div class="profile-row">
            <input
              id="steamid-input"
              type="text"
              inputmode="numeric"
              pattern="\d{17}"
              maxlength="17"
              placeholder="76561199000000000"
            />
            <button type="button" id="steamid-save">Guardar</button>
            <button type="button" id="steamid-clear" class="ghost">Quitar</button>
          </div>
          <p class="profile-status" id="profile-status" role="status"></p>
        </div>
      </details>
    </header>

    <main id="main">
      <p class="status" id="status" role="status" aria-live="polite">
        Busca un juego para ver todos sus logros ordenados por rareza.
      </p>

      <section class="game" id="game" hidden>
        <div class="game-head">
          <img class="game-cover" id="game-cover" alt="" loading="lazy" referrerpolicy="no-referrer" hidden />
          <div class="game-meta">
            <h2 id="game-name"></h2>
            <p class="progress-line" id="progress-line" hidden>
              <strong id="progress-text"></strong>
            </p>
            <div class="progress-bar" id="progress-bar" hidden>
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p class="notice" id="progress-notice" hidden></p>
            <p class="links" id="game-links"></p>
          </div>
        </div>

        <div class="toolbar">
          <div class="filters" id="filters" role="group" aria-label="Filtrar logros" hidden>
            <button type="button" data-filter="all" class="chip is-active">Todos</button>
            <button type="button" data-filter="missing" class="chip">Me faltan</button>
            <button type="button" data-filter="unlocked" class="chip">Conseguidos</button>
          </div>
          <p class="count" id="visible-count"></p>
        </div>

        <ol class="achievements" id="achievements"></ol>
      </section>
    </main>

    <footer class="footer">
      <span id="search-hint">
        El porcentaje es la proporción de jugadores que tiene cada logro: cuanto más bajo, más raro.
      </span>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
