name: keepalive

# GitHub disables scheduled workflows after 60 days without a commit on the
# default branch. The tracker only ever writes to a gist, so a quiet period
# would switch the cron off with no failure to notice.
#
# Checked twice a month and committing only once the repository has gone
# quiet, so an active month adds nothing to the history.
on:
  schedule:
    - cron: "0 4 1,15 * *"
  workflow_dispatch:
    inputs:
      quiet_days:
        description: >-
          Commit when the last one is older than this many days. Dispatch with
          0 to exercise the commit path, which is otherwise unreachable for 45
          days - and a broken push would surface too late to matter.
        type: string
        default: "45"

# The only workflow here with write access, and it holds no secrets. The
# tracker holds the credentials and cannot write; neither can do the other's job.
permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository_owner == 'Isma-L154'

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commit only if the repository has gone quiet
        env:
          # Two checks a month, so the default always lands before day 60.
          QUIET_DAYS: ${{ inputs.quiet_days || '45' }}
        run: |
          set -euo pipefail

          last_commit=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last_commit ) / 86400 ))
          echo "Last commit was ${age_days} day(s) ago; threshold is ${QUIET_DAYS}."

          if [ "${age_days}" -lt "${QUIET_DAYS}" ]; then
            echo "Repository is active. Nothing to do."
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive commit so scheduled workflows stay enabled"
          git push
          echo "Committed. The 60-day inactivity clock is reset."
