name: deploy-web

# Publishes HowToAchieve to Cloudflare whenever main changes.
#
# Before this existed, `main` and production only matched because someone had
# run `wrangler deploy` by hand at the right moment. Nothing enforced it, and
# nothing would have reported the drift.
on:
  push:
    branches: [main]
    # The Worker is built entirely from web/, so a commit that touches only the
    # Python tracker has nothing to publish. This workflow itself is included:
    # a change to how deployment works should prove itself by deploying.
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  # Redeploy on demand - after a rollback, or to confirm production matches
  # main without waiting for a commit.
  workflow_dispatch:

# Reads the repository and nothing else. The Cloudflare credential is a
# repository secret and is never exposed to a pull request from a fork,
# because this only ever runs on push to main.
permissions:
  contents: read

# Deployments must not overlap: two `wrangler deploy` runs racing would leave
# whichever finished last in production, which is not necessarily the newer
# commit. Queue instead of cancelling so an in-flight deploy completes.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # `worker-configuration.d.ts` describes the bindings and is generated
      # from wrangler.jsonc, so it is not in the repository - a checkout does
      # not have one. Generating it needs no credentials; it only reads config.
      - name: Generate binding types
        working-directory: web
        run: npx wrangler types

      # A last look before publishing. The full suite runs in `ci` on the pull
      # request, which is where a failure can still stop something; this is the
      # cheap check that the merge commit itself compiles.
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional. Only needed when the token can reach more than one
          # account, where wrangler cannot infer which one is meant.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Proves the deployment actually serves, rather than trusting that the
      # upload reported success. A green deploy step and a broken site are not
      # the same thing.
      - name: Verify production responds
        run: |
          set -euo pipefail
          # Hardcoded on purpose: this is the address the deployment is
          # supposed to serve. Deriving it from config would make the check
          # agree with a wrong deployment instead of catching it. Update it
          # here if the site ever moves again.
          url="https://howtoachieve.cloudils.com/api/health"
          # Wide enough to cover a custom domain issuing its certificate for
          # the first time, which takes longer than a redeploy. Too short and
          # the deploy succeeds while this reports failure.
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 20 "$url" || true)"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "production healthy: $body"
              exit 0
            fi
            echo "attempt $attempt: not healthy yet (got: ${body:-no response})"
            sleep 15
          done
          echo "::error::Production did not report healthy after the deploy."
          exit 1

      # Every page carries the site's policy, including the ones the Worker
      # builds itself. Checked here rather than only in the test suite because
      # `_headers` is applied by Cloudflare, not by this repository: the suite
      # can prove the Worker copies whatever the asset binding hands it, and
      # only production can prove Cloudflare is still handing it anything.
      #
      # GET, not HEAD - and it mattered. Until #81, `/game/<id>` answered a
      # HEAD from the asset runtime rather than from Worker code, so a HEAD
      # here would have read the policy off the very path that was never
      # missing it, and reported success against the unfixed site. The two
      # agree now, and the step below is what keeps them agreeing.
      - name: Verify Worker-built pages carry the site's policy
        run: |
          set -euo pipefail
          site="https://howtoachieve.cloudils.com"

          # Headers that legitimately differ between two responses: what the response
          # is, how it is cached, and what Cloudflare stamps on every reply. Everything
          # not listed is site-wide and has to match.
          #
          # This list does have to be maintained, unlike the policy itself - but getting
          # it wrong shows up as a red check, never as a green one, which is the right
          # direction for a list that can rot.
          skip='^(date|content-type|content-length|content-encoding|content-language|content-range|cache-control|etag|last-modified|expires|age|vary|accept-ranges|transfer-encoding|connection|location|set-cookie|cf-cache-status|cf-ray|report-to|nel|server|alt-svc|x-robots-tag):'

          # Name *and* value. Comparing names alone passes a header that is present but
          # empty, or one carrying a weaker policy than the static side. Not `curl -f`:
          # a non-2xx would abort the job under `set -e` before any of the messages
          # below could be printed.
          policy() {
            curl -sS -D- -o /dev/null --max-time 20 "$1" |
              tr -d '\r' |
              tr 'A-Z' 'a-z' |
              grep -E '^[a-z0-9-]+:' |
              grep -Ev "$skip" |
              sed 's/: */: /' |
              sort
          }

          # The static side is the reference, read in full rather than filtered to a
          # list of names - so a header added to `_headers` is compared here without
          # this file being touched. An earlier version of this step did filter by name,
          # which made it a third copy of the list, and blind to exactly the header it
          # would have been added to catch.
          expected="$(policy "$site/styles.css")"

          # A floor, because a comparison alone is satisfied by two responses that are
          # equally unprotected. Dropping the CSP line from `_headers` takes it off the
          # static side and the Worker side together, and every relative check stays
          # green while the whole site serves no policy at all.
          for required in content-security-policy x-content-type-options; do
            if ! printf '%s\n' "$expected" | grep -q "^$required:"; then
              echo "::error::The static side is missing $required - _headers is not being applied."
              exit 1
            fi
          done

          status=0
          for path in /game/367520 /api/health; do
            missing="$(comm -23 <(printf '%s\n' "$expected") <(policy "$site$path") || true)"
            if [ -n "$missing" ]; then
              echo "::error::$path does not match the static side:"
              printf '%s\n' "$missing" | sed 's/^/    /'
              status=1
            else
              echo "$path carries the site's policy in full"
            fi
          done
          exit $status

      # HEAD and GET must answer alike. They disagreed for months and nothing
      # noticed, because every check used one or the other and never both -
      # a HEAD for a game page fell through to the asset runtime and described
      # the generic shell instead.
      - name: Verify HEAD answers like GET
        run: |
          set -euo pipefail
          site="https://howtoachieve.cloudils.com"

          # Status, plus the headers that say what the resource is and how big it is.
          # Status alone is not enough: while HEAD was answered by the asset runtime, a
          # game page returned 200 to both and described a different document in each.
          # `content-length` is here because dropping the body dropped the size with it,
          # and neither this check nor the suite could see that.
          describe() {
            curl -sS -D- -o /dev/null --max-time 20 "$@" |
              tr -d '\r' | tr 'A-Z' 'a-z' |
              grep -E '^(http/[0-9.]+ [0-9]{3}|(content-type|content-length|cache-control|vary|content-security-policy):)' |
              sort
          }

          status=0
          for path in /game/367520 /api/health /privacy; do
            # Captured into variables rather than compared inside process substitutions.
            # A process substitution's exit status is invisible to `set -e`, so when curl
            # failed - DNS, TLS, a timeout, a 5xx with no headers - both sides came back
            # empty, `diff` called them identical, and this printed "agrees" and exited
            # 0. A deploy check that goes green against an unreachable site is worse than
            # no check, because it is the one you would trust.
            # `|| true` so a failed curl reaches the check below instead of killing
            # the script silently: the exit code would be right and the log would not
            # say which path could not be read, or that reachability was the problem.
            got="$(describe "$site$path" || true)"
            head="$(describe -I "$site$path" || true)"
            if [ -z "$got" ] || [ -z "$head" ]; then
              echo "::error::$path returned no headers at all - production is unreachable."
              exit 1
            fi

            if difference="$(diff <(printf '%s\n' "$got") <(printf '%s\n' "$head"))"; then
              echo "$path agrees"
            else
              echo "::error::$path answers HEAD differently from GET:"
              printf '%s\n' "$difference" | sed 's/^/    /'
              status=1
            fi
          done
          exit $status

      # The former address must keep answering, and answering with a redirect
      # rather than with the site. It is the part of the rename most likely to
      # break quietly: every link shared before the move points at it, and
      # nothing else in the pipeline would notice it serving a duplicate site
      # or a 404 instead.
      - name: Verify the former address still redirects
        run: |
          set -euo pipefail
          old="https://cazalogros.cloudils.com/game/367520"
          expected="https://howtoachieve.cloudils.com/game/367520"

          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$old")"
          location="$(curl -sSI --max-time 20 "$old" | tr -d '\r' | awk 'tolower($1) == "location:" { print $2 }')"

          if [ "$code" != "301" ] || [ "$location" != "$expected" ]; then
            echo "::error::Expected 301 to $expected, got $code to ${location:-nothing}."
            exit 1
          fi
          echo "former address redirects: $code -> $location"
