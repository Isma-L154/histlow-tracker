name: deploy-web

# Publishes Cazalogros to Cloudflare whenever main changes.
#
# Before this existed, `main` and production only matched because someone had
# run `wrangler deploy` by hand at the right moment. Nothing enforced it, and
# nothing would have reported the drift.
on:
  push:
    branches: [main]
    # The Worker is built entirely from web/, so a commit that touches only the
    # Python tracker has nothing to publish. This workflow itself is included:
    # a change to how deployment works should prove itself by deploying.
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  # Redeploy on demand - after a rollback, or to confirm production matches
  # main without waiting for a commit.
  workflow_dispatch:

# Reads the repository and nothing else. The Cloudflare credential is a
# repository secret and is never exposed to a pull request from a fork,
# because this only ever runs on push to main.
permissions:
  contents: read

# Deployments must not overlap: two `wrangler deploy` runs racing would leave
# whichever finished last in production, which is not necessarily the newer
# commit. Queue instead of cancelling so an in-flight deploy completes.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # `worker-configuration.d.ts` describes the bindings and is generated
      # from wrangler.jsonc, so it is not in the repository - a checkout does
      # not have one. Generating it needs no credentials; it only reads config.
      - name: Generate binding types
        working-directory: web
        run: npx wrangler types

      # A last look before publishing. The full suite runs in `ci` on the pull
      # request, which is where a failure can still stop something; this is the
      # cheap check that the merge commit itself compiles.
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional. Only needed when the token can reach more than one
          # account, where wrangler cannot infer which one is meant.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Proves the deployment actually serves, rather than trusting that the
      # upload reported success. A green deploy step and a broken site are not
      # the same thing.
      - name: Verify production responds
        run: |
          set -euo pipefail
          # Hardcoded on purpose: this is the address the deployment is
          # supposed to serve. Deriving it from config would make the check
          # agree with a wrong deployment instead of catching it. Update it
          # here if the site ever moves again.
          url="https://cazalogros.cloudils.com/api/health"
          # Wide enough to cover a custom domain issuing its certificate for
          # the first time, which takes longer than a redeploy. Too short and
          # the deploy succeeds while this reports failure.
          for attempt in $(seq 1 12); do
            body="$(curl -fsS --max-time 20 "$url" || true)"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              echo "production healthy: $body"
              exit 0
            fi
            echo "attempt $attempt: not healthy yet (got: ${body:-no response})"
            sleep 15
          done
          echo "::error::Production did not report healthy after the deploy."
          exit 1
