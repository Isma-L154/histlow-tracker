name: tracker

# The workflow fires twice a day, twelve hours apart. Costa Rica is UTC-6 all
# year with no DST, so 00:23 UTC is 18:23 local and 12:23 UTC is 06:23 local.
#
# Twice rather than once, because a sale starting in the afternoon would
# otherwise wait for the next morning, and GitHub adds one to eleven hours of
# delivery delay on top. The odd minute keeps out of the queue on the hour.
#
# Sale seasons get no special treatment: no API publishes their dates, and a
# discount on an ordinary Tuesday is what this exists to catch.
on:
  schedule:
    - cron: "23 0 * * *"
    - cron: "23 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the schedule gate and run now"
        type: boolean
        default: true
      dry_run:
        description: "Print the payload instead of publishing it"
        type: boolean
        default: false

# Reads the repository and nothing else; publishing uses a gist-scoped token.
permissions:
  contents: read

# Two runs would race on the shared state cache and could double-notify. Queue
# rather than cancel, so a run already in flight finishes.
concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Structural, not incidental: a fork never reaches the secrets.
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'Isma-L154'

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # A miss is harmless: both are rebuilt, at the cost of one round of lookups.
      - name: Restore state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var
          key: histlow-state-${{ github.run_id }}
          restore-keys: |
            histlow-state-

      - name: Run tracker
        env:
          PYTHONPATH: src
          STEAM_ID64: ${{ secrets.STEAM_ID64 }}
          # Variables, not secrets: as secrets GitHub would redact "CR" and
          # "US" everywhere they appear in a log, including inside words.
          STORE_COUNTRY: ${{ vars.STORE_COUNTRY || 'CR' }}
          COMPARISON_COUNTRY: ${{ vars.COMPARISON_COUNTRY || 'US' }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python -m histlow \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs on failure too, so lookups already paid for are kept.
      - name: Save state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var
          key: histlow-state-${{ github.run_id }}
