name: tracker

# Once a day, every day, with no seasonal calendar. No official Steam API
# publishes the sale dates, hand-maintained ones rot, and a discount appearing
# on an ordinary Tuesday is exactly what this exists to catch - so a sale
# season gets no special treatment.
#
# 00:17 UTC is 18:17 in Costa Rica (UTC-6 all year, no DST). The odd minute is
# deliberate: GitHub queues scheduled runs hardest on the hour, and a job
# asking for 00:00 is routinely delayed.
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the schedule gate and run now"
        type: boolean
        default: true
      dry_run:
        description: "Print the payload instead of publishing it"
        type: boolean
        default: false

# The job reads the repository and nothing else. Publishing uses a separate
# gist-scoped token, so a compromised workflow cannot touch this repository.
permissions:
  contents: read

# Two runs must never interleave: they would race on the shared state cache and
# could double-notify. Queue rather than cancel, so a scheduled run already in
# flight is allowed to finish.
concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Secrets are never exposed to a fork, and this makes that structural
    # rather than incidental.
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'Isma-L154'

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Restores the identity cache and alert state from the previous run.
      # A miss is harmless: the tracker rebuilds both, at the cost of one
      # round of lookups and possibly one repeated notification.
      - name: Restore state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var
          key: histlow-state-${{ github.run_id }}
          restore-keys: |
            histlow-state-

      - name: Run tracker
        env:
          PYTHONPATH: src
          STEAM_ID64: ${{ secrets.STEAM_ID64 }}
          # Repository variables, not secrets. They are not sensitive, and as
          # secrets GitHub would redact the literals "CR" and "US" everywhere
          # they appear in a log - including inside unrelated words, which
          # mangles the output. Still overridable without a commit.
          # COMPARISON_COUNTRY must name a region ITAD tracks; see
          # .env.example for why it differs from STORE_COUNTRY.
          STORE_COUNTRY: ${{ vars.STORE_COUNTRY || 'CR' }}
          COMPARISON_COUNTRY: ${{ vars.COMPARISON_COUNTRY || 'US' }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python -m histlow \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Runs even on failure so that identity lookups already paid for are not
      # discarded. The key is unique per run; restore-keys picks the newest.
      - name: Save state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var
          key: histlow-state-${{ github.run_id }}
