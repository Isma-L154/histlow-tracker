name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.12 is what the tracker
        # workflow runs. Both are exercised so neither can drift.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      # The runtime must stay dependency-free. Importing the whole package on a
      # bare interpreter is what proves it, rather than trusting pyproject.
      - name: Verify the runtime has no third-party dependencies
        env:
          PYTHONPATH: src
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/python -c "
          import importlib, pkgutil, sys
          sys.path.insert(0, 'src')
          import histlow
          for module in pkgutil.iter_modules(histlow.__path__):
              importlib.import_module(f'histlow.{module.name}')
          print('all modules import on a bare interpreter')
          "

  # The Worker's own checks. These ran only inside deploy-web, which fires
  # after a merge - so a broken Worker passed review and failed on main, twice.
  # A gate that cannot fail before merging is not a gate.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Generated from wrangler.jsonc, so a checkout does not have one.
      # Reads configuration only; needs no credentials.
      - name: Generate binding types
        working-directory: web
        run: npx wrangler types

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      # Runs in workerd with `remoteBindings: false`, so no Cloudflare
      # credential is involved and nothing here can reach the real account.
      - name: Test
        working-directory: web
        run: npm test
