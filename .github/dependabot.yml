version: 2

# Security alerts arrive without this file; what it adds is routine updates,
# batched into one pull request a month per ecosystem.
updates:
  # All devDependencies: none of it is bundled into the deployed Worker.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      toolchain:
        patterns: ["*"]

  # Actions are pinned by digest, so a moved tag cannot swap in unreviewed code
  # near the secrets. A digest never picks up a fix on its own; this is what does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The tracker has no runtime dependencies; `dev` is pytest and ruff. Listed so
  # a future one lands in a manifest Dependabot already watches.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns: ["*"]
